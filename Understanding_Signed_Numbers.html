<div class="passcode-box">
  <h3>Teacher Answer Key Access</h3>
  <p>Enter the authorized passcode to view the answer key:</p>
  
  <div class="input-group">
    <input 
      type="password" 
      id="passcode-input" 
      placeholder="Enter passcode"
      autocomplete="off"
    />
    <button id="unlock-btn" onclick="checkPasscode()">Unlock</button>
  </div>
  
  <p id="error-msg" class="error-msg">Incorrect passcode. Please try again.</p>
</div>

<script>
function checkPasscode() {
  const input = document.getElementById('passcode-input').value;
  const errorMsg = document.getElementById('error-msg');
  const teacherKey = document.querySelector('.teacher-key');
  
  // Replace 'YOUR_SECRET_PASSCODE' with your actual passcode
  const CORRECT_PASSCODE = "YOUR_SECRET_PASSCODE"; 

  if (input === CORRECT_PASSCODE) {
    teacherKey.style.display = "block";
    errorMsg.style.display = "none";
  } else {
    errorMsg.style.display = "block";
  }
}
</script>
